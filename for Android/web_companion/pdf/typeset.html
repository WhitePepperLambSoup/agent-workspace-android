<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- create_pdf's page: Android prints it as an A4 PDF. The layout width matches A4 minus margins. -->
<meta name="viewport" content="width=800">
<link rel="stylesheet" href="katex.min.css">
<style>
  @page { size: A4; margin: 20mm 18mm; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; }
  @media screen { body { width: 174mm; } }
  body {
    color: #111; line-height: 1.6; overflow-wrap: anywhere;
    font-family: "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  body.format-latex { font-family: "KaTeX_Main", "Noto Serif CJK SC", "Noto Serif SC", serif; text-align: justify; }
  h1 { font-size: 1.75em; line-height: 1.3; margin: 0 0 .6em; }
  h2 { font-size: 1.4em; margin: 1.3em 0 .5em; }
  h3 { font-size: 1.2em; margin: 1.1em 0 .45em; }
  h4 { font-size: 1.07em; margin: 1em 0 .4em; }
  h5, h6 { font-size: 1em; margin: .9em 0 .35em; }
  h1, h2, h3, h4, h5, h6 { line-height: 1.35; break-after: avoid; page-break-after: avoid; text-align: left; }
  .format-latex h1 { text-align: center; font-weight: normal; font-size: 1.85em; margin: .4em 0 .5em; }
  .format-latex .meta { text-align: center; margin: .25em 0; font-size: 1.08em; }
  .format-latex .meta + p:not(.meta), .format-latex .meta + h2 { margin-top: 1.8em; }
  .format-latex h2, .format-latex h3, .format-latex h4 { font-weight: bold; }
  p { margin: .55em 0; orphans: 2; widows: 2; }
  ul, ol { padding-left: 1.7em; margin: .5em 0; }
  li { margin: .2em 0; }
  li > p { margin: .25em 0; }
  pre {
    background: #f4f5f5; border-radius: 4px; padding: .7em .9em; font-size: .85em; line-height: 1.45;
    white-space: pre-wrap; break-inside: avoid; text-align: left;
  }
  code { font-family: "Droid Sans Mono", "Noto Sans Mono", monospace; font-size: .9em; }
  :not(pre) > code { background: #f1f2f2; padding: .08em .3em; border-radius: 3px; }
  blockquote { margin: .8em 0; padding: .1em 1em; border-left: 3px solid #c8cdcc; color: #333; }
  .format-latex blockquote { border-left: none; padding: 0 2.5em; }
  table { border-collapse: collapse; margin: .9em auto; break-inside: avoid; font-size: .95em; text-align: left; }
  th, td { border: 1px solid #9aa3a1; padding: .3em .7em; vertical-align: top; }
  th { background: #f1f3f3; }
  .format-latex table { border-top: 1.5px solid #111; border-bottom: 1.5px solid #111; }
  .format-latex th, .format-latex td { border: none; }
  .format-latex th { background: none; border-bottom: 1px solid #111; }
  hr { border: none; border-top: 1px solid #bbb; margin: 1.2em 0; }
  img { max-width: 100%; }
  a { color: #0b5e55; text-decoration: none; }
  /* Some phone makers' WebViews add a font rule for every element (ZTE's "zteCustom"): it would
     beat inherited fonts, so digits and operators in formulas and the text itself came out in the
     phone's own font. Inheriting explicitly, from more specific rules, keeps the document's fonts
     (KaTeX's own rules for letters and symbols are more specific still). */
  #document { font-family: inherit; }
  #document :is(h1, h2, h3, h4, h5, h6, p, li, ul, ol, td, th, tr, table, a, strong, em, blockquote, div, section, sup, sub, span):not(.katex):not(.katex *) { font-family: inherit; }
  #document code, #document pre { font-family: "Droid Sans Mono", "Noto Sans Mono", monospace; }
  .katex * { font-family: inherit; }
  .katex { font-size: 1.1em; }
  .katex-display { margin: .9em 0; break-inside: avoid; }
  .page-break { break-after: page; page-break-after: always; }
  p.center { text-align: center; }
  .s-bold { font-weight: bold; } .s-italic { font-style: italic; } .s-smallcaps { font-variant: small-caps; }
  .s-mono { font-family: "Droid Sans Mono", "Noto Sans Mono", monospace; }
  .s-tiny { font-size: .5em; } .s-scriptsize { font-size: .7em; } .s-footnotesize { font-size: .8em; }
  .s-small { font-size: .9em; } .s-large { font-size: 1.2em; } .s-Large { font-size: 1.44em; }
  .s-LARGE { font-size: 1.73em; } .s-huge { font-size: 2.07em; } .s-Huge { font-size: 2.49em; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
  section.footnotes { margin-top: 2em; border-top: 1px solid #ccc; font-size: .85em; }
</style>
<script src="../static/mobile-vendor.js"></script>
<script src="typeset.js"></script>
</head>
<body>
<main id="document"></main>
<script>PdfTypeset.start();</script>
</body>
</html>
